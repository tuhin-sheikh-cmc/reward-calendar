<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Points breakdown for a Puroshkar member" />
    <title>Points history — Puroshkar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6A4A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 7v14'/%3E%3Cpath d='M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8'/%3E%3Cpath d='M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5'/%3E%3Crect x='3' y='7' width='18' height='4' rx='1'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tailwind.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-sans text-on-surface antialiased">
    {{HEADER}}
    {{NAVIGATION}}

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
      <section id="person-app" class="mx-auto max-w-2xl" hidden>
        <a
          href="/"
          class="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-medium text-on-surface-variant transition-colors hover:bg-surface-container-high"
        >
          <span class="material-symbols-rounded text-base">arrow_back</span>
          Back to members
        </a>

        <header class="mt-4 flex items-center gap-4 rounded-2xl bg-surface-container p-4 shadow-elevation-1">
          <img
            id="person-avatar"
            alt=""
            width="64"
            height="64"
            referrerpolicy="no-referrer"
            class="h-16 w-16 shrink-0 rounded-full bg-surface-container-highest"
          />
          <div class="min-w-0 flex-1">
            <h1 id="person-name" class="truncate text-lg font-medium text-on-surface"></h1>
            <p id="person-role" class="mt-0.5 text-sm text-on-surface-variant"></p>
          </div>
          <div class="flex shrink-0 flex-col items-end gap-1">
            <span id="person-balance" class="text-lg font-medium tabular-nums text-primary"></span>
            <span class="text-xs text-on-surface-variant">points balance</span>
          </div>
        </header>

        <div class="mt-6 mb-3 flex items-baseline justify-between gap-3">
          <h2 class="text-base font-medium text-on-surface">Points history</h2>
          <p id="entries-count" class="text-sm text-on-surface-variant"></p>
        </div>

        <section id="entries-loading" class="space-y-2" aria-label="Loading points history">
          <div class="h-16 animate-pulse rounded-2xl bg-surface-container-highest"></div>
          <div class="h-16 animate-pulse rounded-2xl bg-surface-container-highest"></div>
          <div class="h-16 animate-pulse rounded-2xl bg-surface-container-highest"></div>
        </section>

        <ul id="entries" class="space-y-2" aria-live="polite"></ul>

        <p id="entries-empty" class="py-10 text-center text-sm text-on-surface-variant" hidden>
          No points activity yet.
        </p>

        <p id="entries-error" class="py-4 text-center text-sm text-error" role="alert" hidden></p>

        <div class="mt-6 flex justify-center">
          <button
            id="load-more"
            type="button"
            class="inline-flex items-center gap-2 rounded-full border border-outline-variant px-5 py-2 text-sm font-medium text-on-surface transition-colors hover:bg-surface-container-high"
            hidden
          >
            <span class="material-symbols-rounded text-base">expand_more</span>
            Load more
          </button>
        </div>
      </section>
    </main>

    {{FOOTER}}

    <script type="module" src="/assets/person.js"></script>
  </body>
</html>
