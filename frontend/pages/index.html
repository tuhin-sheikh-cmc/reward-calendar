<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Puroshkar members and the points they have earned" />
    <title>Members — Puroshkar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6A4A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 7v14'/%3E%3Cpath d='M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8'/%3E%3Cpath d='M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5'/%3E%3Crect x='3' y='7' width='18' height='4' rx='1'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tailwind.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-sans text-on-surface antialiased">
    {{HEADER}}
    {{NAVIGATION}}

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
      <div class="mb-6">
        <h1 class="text-2xl font-medium tracking-tight text-on-surface">Members</h1>
        <p class="mt-1 text-sm text-on-surface-variant">Points earned so far by loyal receivers</p>
      </div>

      <section id="loading" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-label="Loading members">
        <article class="flex items-center gap-4 rounded-2xl bg-surface-container p-4">
          <div class="h-16 w-16 shrink-0 animate-pulse rounded-full bg-surface-container-highest"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 w-2/3 animate-pulse rounded bg-surface-container-highest"></div>
            <div class="h-3 w-1/3 animate-pulse rounded bg-surface-container-highest"></div>
          </div>
        </article>
        <article class="flex items-center gap-4 rounded-2xl bg-surface-container p-4">
          <div class="h-16 w-16 shrink-0 animate-pulse rounded-full bg-surface-container-highest"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 w-2/3 animate-pulse rounded bg-surface-container-highest"></div>
            <div class="h-3 w-1/3 animate-pulse rounded bg-surface-container-highest"></div>
          </div>
        </article>
        <article class="flex items-center gap-4 rounded-2xl bg-surface-container p-4">
          <div class="h-16 w-16 shrink-0 animate-pulse rounded-full bg-surface-container-highest"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 w-2/3 animate-pulse rounded bg-surface-container-highest"></div>
            <div class="h-3 w-1/3 animate-pulse rounded bg-surface-container-highest"></div>
          </div>
        </article>
      </section>

      <section id="cards" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></section>

      <section id="empty" class="py-16 text-center" hidden>
        <span class="material-symbols-rounded text-5xl text-outline">group_off</span>
        <h2 class="mt-3 text-lg font-medium text-on-surface">No members yet</h2>
        <p class="mt-1 text-sm text-on-surface-variant">Receivers will appear here once they are added.</p>
      </section>

      <section id="error" class="py-16 text-center" hidden>
        <span class="material-symbols-rounded text-5xl text-error">error_outline</span>
        <h2 class="mt-3 text-lg font-medium text-on-surface">Could not load members</h2>
        <p id="error-message" class="mt-1 text-sm text-on-surface-variant"></p>
        <button id="retry" class="mt-4 inline-flex items-center gap-2 rounded-full bg-primary px-5 py-2 text-sm font-medium text-on-primary transition-opacity hover:opacity-90">
          <span class="material-symbols-rounded text-base">refresh</span>
          Retry
        </button>
      </section>
    </main>

    {{FOOTER}}

    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
