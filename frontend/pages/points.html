<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Providers adjust loyalty points for receivers" />
    <title>Manage points — Puroshkar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6A4A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 7v14'/%3E%3Cpath d='M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8'/%3E%3Cpath d='M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5'/%3E%3Crect x='3' y='7' width='18' height='4' rx='1'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tailwind.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-sans text-on-surface antialiased">
    {{HEADER}}
    {{NAVIGATION}}

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
      <section id="points-app" class="mx-auto max-w-xl" aria-label="Manage points" hidden>
        <div class="mb-6">
          <h1 class="text-2xl font-medium tracking-tight text-on-surface">Manage points</h1>
          <p class="mt-1 text-sm text-on-surface-variant">
            Pick a receiver, then grant or remove loyalty points.
          </p>
        </div>

        <form
          id="points-form"
          class="flex flex-col gap-4 rounded-2xl bg-surface-container p-6 shadow-elevation-1"
          novalidate
        >
          <label class="flex flex-col gap-1.5" for="receiver-select">
            <span class="text-sm font-medium text-on-surface-variant">Receiver</span>
            <select
              id="receiver-select"
              name="receiver"
              required
              class="w-full rounded-xl border border-outline-variant bg-surface px-4 py-2.5 text-on-surface outline-none transition-colors focus:border-primary"
            >
              <option value="">Loading receivers…</option>
            </select>
          </label>

          <p id="receiver-balance" class="text-sm text-on-surface-variant" hidden>
            Current balance: <span id="receiver-balance-value" class="font-medium text-on-surface tabular-nums"></span> points
          </p>

          <label class="flex flex-col gap-1.5" for="points-amount">
            <span class="text-sm font-medium text-on-surface-variant">Points</span>
            <input
              id="points-amount"
              name="points"
              type="number"
              min="1"
              step="1"
              required
              inputmode="numeric"
              class="w-full rounded-xl border border-outline-variant bg-surface px-4 py-2.5 text-on-surface outline-none transition-colors focus:border-primary"
            />
          </label>

          <label class="flex flex-col gap-1.5" for="points-reason">
            <span class="text-sm font-medium text-on-surface-variant">Reason (optional)</span>
            <input
              id="points-reason"
              name="reason"
              type="text"
              maxlength="200"
              class="w-full rounded-xl border border-outline-variant bg-surface px-4 py-2.5 text-on-surface outline-none transition-colors focus:border-primary"
            />
          </label>

          <p id="points-error" class="text-sm text-error" role="alert" hidden></p>
          <p id="points-feedback" class="text-sm text-primary" role="status" hidden></p>

          <div class="flex flex-wrap items-center gap-3">
            <button
              id="add-points"
              type="submit"
              name="action"
              value="add"
              class="inline-flex items-center justify-center gap-2 rounded-full bg-primary px-5 py-2 text-sm font-medium text-on-primary transition-opacity hover:opacity-90"
            >
              <span class="material-symbols-rounded text-base">add</span>
              Add points
            </button>
            <button
              id="remove-points"
              type="submit"
              name="action"
              value="remove"
              class="inline-flex items-center justify-center gap-2 rounded-full border border-outline-variant px-5 py-2 text-sm font-medium text-on-surface transition-colors hover:bg-surface-container-high"
            >
              <span class="material-symbols-rounded text-base">remove</span>
              Remove points
            </button>
          </div>
        </form>
      </section>
    </main>

    {{FOOTER}}

    <script type="module" src="/assets/points.js"></script>
  </body>
</html>
